name = "hof-api"
main = "src/index.ts"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
LOG_LEVEL = "info"
RATE_LIMIT_ENABLED = "true"

[env.staging]
name = "hof-api-staging"
vars = { APP_ENV = "staging", LOG_LEVEL = "info", RATE_LIMIT_ENABLED = "true" }

[env.production]
name = "hof-api"
vars = { APP_ENV = "production", LOG_LEVEL = "warn", RATE_LIMIT_ENABLED = "true" }
