name = "hof-base"
main = "src/index.ts"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
LOG_LEVEL = "info"
RATE_LIMIT_ENABLED = "true"
TIKTOK_SYNC_ENABLED = "false"

[triggers]
crons = ["*/5 * * * *"]

[env.staging]
name = "hof-base-staging"
vars = { APP_ENV = "staging", LOG_LEVEL = "info", RATE_LIMIT_ENABLED = "true", TIKTOK_SYNC_ENABLED = "false" }

[env.production]
name = "hof-base"
vars = { APP_ENV = "production", LOG_LEVEL = "warn", RATE_LIMIT_ENABLED = "true", TIKTOK_SYNC_ENABLED = "false" }

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.production.triggers]
crons = ["*/5 * * * *"]
# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
# ...
