name = "hof-base"
main = "src/index.ts"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
LOG_LEVEL = "info"
RATE_LIMIT_ENABLED = "true"
TIKTOK_SCRAPER_BASE_URL = "https://hof.talesapi.workers.dev"
TIKTOK_PROFILE_PATH = "/api/profile"
TIKTOK_POSTS_PATH = "/api/profile/posts"
TIKTOK_SYNC_BATCH_SIZE = "10"
TIKTOK_SYNC_ENABLED = "false"

[[services]]
binding = "TIKTOK_SCRAPER"
service = "hof"

[triggers]
crons = ["*/5 * * * *"]

[env.staging]
name = "hof-base-staging"
vars = { APP_ENV = "staging", LOG_LEVEL = "info", RATE_LIMIT_ENABLED = "true", TIKTOK_SCRAPER_BASE_URL = "https://hof.talesapi.workers.dev", TIKTOK_PROFILE_PATH = "/api/profile", TIKTOK_POSTS_PATH = "/api/profile/posts", TIKTOK_SYNC_BATCH_SIZE = "10", TIKTOK_SYNC_ENABLED = "false" }

[env.production]
name = "hof-base"
vars = { APP_ENV = "production", LOG_LEVEL = "warn", RATE_LIMIT_ENABLED = "true", TIKTOK_SCRAPER_BASE_URL = "https://hof.talesapi.workers.dev", TIKTOK_PROFILE_PATH = "/api/profile", TIKTOK_POSTS_PATH = "/api/profile/posts", TIKTOK_SYNC_BATCH_SIZE = "10", TIKTOK_SYNC_ENABLED = "false" }

[env.staging.triggers]
crons = ["*/5 * * * *"]
[env.production.triggers]
crons = ["*/5 * * * *"]

[[env.staging.services]]
binding = "TIKTOK_SCRAPER"
service = "hof"

[[env.production.services]]
binding = "TIKTOK_SCRAPER"
service = "hof"
