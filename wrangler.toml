# Cloudflare Worker config.
#
# This file lives at the REPOSITORY ROOT on purpose: Cloudflare's build
# system runs `npx wrangler deploy` from the repo root, so wrangler must
# find its config there. The TypeScript source stays in worker/src/ to keep
# it separate from the Python package.

name = "hof"
main = "worker/src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Optional shared secret. If you set it, every request must send it:
#   npx wrangler secret put API_KEY
# and callers pass it as ?key=..., X-API-Key: ..., or Authorization: Bearer ...
# (leave unset for a public demo worker)

[observability]
enabled = true

# The free plan allows 50 subrequests per request; one TikTok page = one
# subrequest, and MAX_ITEMS in worker/src/index.ts keeps batches inside that.
# Note: cpu_ms = 30000 needs a paid plan - the free tier allows only 10 ms.
[limits]
cpu_ms = 30000
